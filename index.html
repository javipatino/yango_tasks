<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yango — Task Board</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 13px; }
.wrapper { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
.top-bar h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1a1a1a; }
.last-updated { font-size: 11px; color: #888; }
.area-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.75rem; }
.person-filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 0.6rem; min-height: 28px; }
.tab-filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.filter-btn { font-size: 11px; padding: 3px 11px; border-radius: 20px; border: 1px solid #d0d0d0; background: #fff; color: #666; cursor: pointer; transition: all 0.15s; }
.filter-btn:hover { background: #f0f0f0; }
.filter-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
.filter-btn.prio-btn.active { background: #c0392b; border-color: #c0392b; }
.area-btn.active-mkt { background: #0F6E56; border-color: #0F6E56; }
.area-btn.active-pr  { background: #993C1D; border-color: #993C1D; }
.area-btn.active-gr  { background: #533AB7; border-color: #533AB7; }
.area-btn.active-otros { background: #5F5E5A; border-color: #5F5E5A; }
.tabs { display: flex; border-bottom: 1px solid #e0e0e0; margin-bottom: 1.5rem; }
.tab { font-size: 13px; padding: 7px 16px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab:hover { color: #333; }
.tab.active { color: #185FA5; border-bottom-color: #185FA5; font-weight: 500; }
.view { display: none; }
.view.active { display: block; }
.person-block { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
.person-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.9rem; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.person-name { font-size: 13px; font-weight: 600; color: #1a1a1a; }
.task-count { font-size: 11px; color: #999; }

/* KR subsection */
.kr-subsection { margin-bottom: 1rem; }
.kr-subsection-header { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: #f0f0ee; border-radius: 6px; margin-bottom: 4px; }
.kr-subsection-title { font-size: 11px; font-weight: 700; color: #444; letter-spacing: 0.03em; }
.kr-subsection-desc { font-size: 11px; color: #777; }
.kr-subsection-eta { font-size: 10px; color: #bbb; margin-left: auto; }
.kr-subsection-pending { font-size: 10px; font-style: italic; color: #aaa; padding: 4px 8px; margin-bottom: 4px; }

/* Task table */
.task-table { width: 100%; border-collapse: collapse; }
.task-table th { font-size: 10px; color: #aaa; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px; text-align: left; }
.task-table td { padding: 4px 6px; border-bottom: 1px solid #f5f5f3; vertical-align: middle; }
.task-table tr:last-child td { border-bottom: none; }
.task-table tr.high-prio td { background: #fff5f5; }
.task-cat { font-size: 11px; color: #999; white-space: nowrap; }
.task-desc { font-size: 11px; color: #1a1a1a; line-height: 1.4; }
.task-link { font-size: 10px; color: #185FA5; text-decoration: none; display: inline-block; margin-top: 1px; }
.task-link:hover { text-decoration: underline; }
.mini-select { font-size: 11px; border: 1px solid #d8d8d8; border-radius: 4px; padding: 1px 3px; height: 22px; background: #fff; color: #333; cursor: pointer; width: 100%; }
.task-table tr.high-prio .mini-select { background: #fff5f5; }
.eta-wrap { display: flex; align-items: center; gap: 4px; }
.eta-label { font-size: 11px; color: #999; min-width: 55px; }
.mini-date { font-size: 11px; border: 1px solid #d8d8d8; border-radius: 4px; padding: 1px 3px; height: 22px; background: #fff; color: #333; cursor: pointer; }
.task-table tr.high-prio .mini-date { background: #fff5f5; }
.kam-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa; margin: 1.25rem 0 0.5rem; padding-bottom: 4px; border-bottom: 1px solid #e0e0e0; }

/* Action buttons column */
.action-btns { display: flex; align-items: center; gap: 3px; }
.update-toggle { background: none; border: none; color: #ccc; cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 3px; line-height: 1; white-space: nowrap; }
.update-toggle:hover { color: #185FA5; background: #f0f5ff; }
.move-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 3px; line-height: 1; }
.move-btn:hover { color: #888; background: #f0f0ee; }
.delete-btn { background: none; border: none; color: #ddd; cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 3px; line-height: 1; }
.delete-btn:hover { color: #c0392b; background: #fff0f0; }

/* Move modal */
.move-modal-row { display: none; }
.move-modal-row.open { display: table-row; }
.move-modal-inner { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f5f5f3; border-bottom: 1px solid #e8e8e8; }
.move-modal-inner label { font-size: 11px; color: #666; }
.move-modal-inner select { font-size: 11px; border: 1px solid #d8d8d8; border-radius: 4px; padding: 2px 5px; height: 24px; background: #fff; cursor: pointer; }
.move-modal-inner button { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid #185FA5; background: #185FA5; color: #fff; cursor: pointer; }
.move-modal-inner .cancel-btn { background: #fff; color: #888; border-color: #d8d8d8; }

/* Update panel */
.update-panel-row { display: none; }
.update-panel-row.open { display: table-row; }
.update-panel-inner { background: #f9f9f7; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
.update-entry { font-size: 11px; color: #555; padding: 4px 0; border-bottom: 1px solid #efefed; line-height: 1.4; }
.update-entry:last-child { border-bottom: none; }
.update-date { font-weight: 600; color: #999; margin-right: 6px; }
.update-add { display: flex; gap: 6px; margin-top: 8px; }
.update-add input { flex: 1; font-size: 11px; border: 1px solid #d8d8d8; border-radius: 4px; padding: 3px 6px; height: 24px; }
.update-add button { font-size: 10px; padding: 2px 10px; border-radius: 4px; border: 1px solid #185FA5; background: #185FA5; color: #fff; cursor: pointer; white-space: nowrap; }

/* Add task */
.add-task-row td { background: #f9f9f7 !important; border-bottom: none !important; }
.add-task-row input:not([type=date]) { font-size: 11px; border: 1px solid #d8d8d8; border-radius: 4px; padding: 1px 4px; height: 22px; background: #fff; color: #333; width: 100%; }
.add-task-btn { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid #185FA5; background: #185FA5; color: #fff; cursor: pointer; }
.add-row-trigger { font-size: 11px; color: #185FA5; cursor: pointer; padding: 5px 6px; display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; margin-top: 4px; }
.add-row-trigger:hover { background: #f0f5ff; }

/* Today */
.today-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.today-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 14px; }
.today-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.today-task { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f5f5f3; }
.today-task:last-child { border-bottom: none; padding-bottom: 0; }
.check-box { width: 15px; height: 15px; border-radius: 3px; border: 1px solid #ccc; flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; background: #fff; }
.check-box.checked { background: #639922; border-color: #639922; color: #fff; }

/* Gantt */
.gantt-wrap { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 1rem 1.25rem; overflow-x: auto; }
.gantt-months { display: flex; margin-bottom: 6px; padding-left: 192px; }
.gantt-month { flex: 1; font-size: 10px; color: #aaa; text-align: center; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.gantt-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid #f5f5f3; }
.gantt-row:last-child { border-bottom: none; }
.gantt-label { width: 120px; flex-shrink: 0; font-size: 11px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-av { width: 26px; flex-shrink: 0; }
.gantt-track { flex: 1; height: 18px; background: #f5f5f3; border-radius: 3px; position: relative; min-width: 200px; }
.gantt-bar { position: absolute; height: 100%; border-radius: 3px; display: flex; align-items: center; padding: 0 5px; font-size: 9px; font-weight: 600; white-space: nowrap; overflow: hidden; color: #fff; }
.empty { text-align: center; color: #aaa; font-size: 13px; padding: 3rem; }
.loading { text-align: center; color: #aaa; font-size: 13px; padding: 3rem; }
.sync-bar { position: fixed; bottom: 1rem; right: 1rem; display: flex; align-items: center; gap: 8px; background: #1a1a1a; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 500; z-index: 100; transition: all 0.3s; opacity: 0; pointer-events: none; }
.sync-bar.visible { opacity: 1; pointer-events: auto; }
.sync-bar.saving { background: #185FA5; }
.sync-bar.saved { background: #3B6D11; }
.sync-bar.error { background: #A32D2D; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-bar">
    <h1>Yango — Task Board</h1>
    <span class="last-updated" id="last-updated"></span>
  </div>
  <div class="area-filters" id="area-filters">
    <button class="filter-btn area-btn" onclick="filterArea('all',this)">Todos</button>
    <button class="filter-btn area-btn active" onclick="filterArea('ops',this)">Ops</button>
    <button class="filter-btn area-btn" onclick="filterArea('mkt',this)">Mkt</button>
    <button class="filter-btn area-btn" onclick="filterArea('pr',this)">PR</button>
    <button class="filter-btn area-btn" onclick="filterArea('gr',this)">GR</button>
    <button class="filter-btn area-btn" onclick="filterArea('otros',this)">Otros</button>
  </div>
  <div class="person-filters" id="person-filters"></div>
  <div class="tab-filters">
    <button class="filter-btn prio-btn" onclick="togglePrioFilter(this)">⚡ Prioritarios</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('board',this)">Tablero</div>
    <div class="tab" onclick="switchTab('today',this)">Hoy</div>
    <div class="tab" onclick="switchTab('gantt',this)">Gantt</div>
  </div>
  <div id="view-board" class="view active"><div class="loading">Cargando...</div></div>
  <div id="view-today" class="view"></div>
  <div id="view-gantt" class="view"></div>
</div>
<div class="sync-bar" id="sync-bar"><span id="sync-msg">Guardando...</span></div>

<script>
const JSON_URL = 'https://javipati.app.n8n.cloud/webhook/yango-get-tasks';
const WEBHOOK_URL = 'https://javipati.app.n8n.cloud/webhook/yango-web-update';

let data = null;
let currentArea = 'ops';
let currentPerson = 'all';
let onlyPrio = false;
let taskStatus = {};
let taskPriority = {};
let taskEta = {};
let taskUpdates = {};
let taskKr = {};       // task id → kr cat (string)
let saveTimer = null;

async function loadData() {
  try {
    const r = await fetch(JSON_URL + '?t=' + Date.now());
    data = await r.json();
    document.getElementById('last-updated').textContent = 'Actualizado: ' + data.last_updated;
    initState();
    renderPersonFilters();
    renderAll();
  } catch(e) {
    document.getElementById('view-board').innerHTML = '<div class="empty">Error cargando datos.</div>';
  }
}

function initState() {
  Object.values(data.areas).forEach(area => {
    [...(area.people||[]), ...(area.kams||[])].forEach(p => {
      const firstKr = p.krs && p.krs.length ? p.krs[0].cat : null;
      p.tasks.forEach(t => {
        taskStatus[t.id] = t.status;
        taskPriority[t.id] = t.priority;
        taskEta[t.id] = t.eta;
        taskUpdates[t.id] = t.updates || [];
        // If task has no kr field, assign to first KR
        taskKr[t.id] = t.kr || firstKr || null;
      });
    });
  });
}

function getPerson(personId) {
  for (const area of Object.values(data.areas)) {
    for (const p of [...(area.people||[]), ...(area.kams||[])]) {
      if (p.id === personId) return p;
    }
  }
  return null;
}

function allPeopleInArea(area) {
  if (area === 'all') {
    let r = [];
    Object.values(data.areas).forEach(a => r = r.concat(a.people||[], a.kams||[]));
    return r;
  }
  const a = data.areas[area];
  return a ? [...(a.people||[]), ...(a.kams||[])] : [];
}

function isoToDisplay(iso) {
  if (!iso) return '—';
  if (iso.startsWith('Q')) return iso;
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function filterArea(area, btn) {
  currentArea = area; currentPerson = 'all';
  document.querySelectorAll('.area-btn').forEach(b => b.classList.remove('active','active-mkt','active-pr','active-gr','active-otros'));
  btn.classList.add('active');
  if (area === 'mkt') btn.classList.add('active-mkt');
  else if (area === 'pr') btn.classList.add('active-pr');
  else if (area === 'gr') btn.classList.add('active-gr');
  else if (area === 'otros') btn.classList.add('active-otros');
  renderPersonFilters(); renderAll();
}

function togglePrioFilter(btn) {
  onlyPrio = !onlyPrio;
  btn.classList.toggle('active', onlyPrio);
  renderAll();
}

function filterPerson(id, btn) {
  currentPerson = id;
  document.querySelectorAll('.person-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function renderPersonFilters() {
  const c = document.getElementById('person-filters');
  const people = allPeopleInArea(currentArea);
  if (!people.length) { c.innerHTML = ''; return; }
  let html = `<button class="filter-btn active" onclick="filterPerson('all',this)">Todos</button>`;
  people.forEach(p => { html += `<button class="filter-btn" onclick="filterPerson('${p.id}',this)">${p.name}</button>`; });
  c.innerHTML = html;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + tab).classList.add('active');
}

function filteredPeople() {
  if (currentArea === 'all') {
    let r = [];
    Object.values(data.areas).forEach(a => r = r.concat(a.people||[]));
    return currentPerson === 'all' ? r : r.filter(x => x.id === currentPerson);
  }
  const a = data.areas[currentArea];
  const p = a ? (a.people||[]) : [];
  return currentPerson === 'all' ? p : p.filter(x => x.id === currentPerson);
}

function filteredKams() {
  if (currentArea === 'all') {
    let r = [];
    Object.values(data.areas).forEach(a => r = r.concat(a.kams||[]));
    return currentPerson === 'all' ? r : r.filter(x => x.id === currentPerson);
  }
  const a = data.areas[currentArea];
  const k = a ? (a.kams||[]) : [];
  return currentPerson === 'all' ? k : k.filter(x => x.id === currentPerson);
}

function prioSelect(id) {
  const v = taskPriority[id] || '';
  return `<select class="mini-select" onchange="updatePriority('${id}',this.value)">
    <option value="" ${!v?'selected':''}>—</option>
    <option value="Alta" ${v==='Alta'?'selected':''}>Alta</option>
    <option value="Media" ${v==='Media'?'selected':''}>Media</option>
    <option value="Baja" ${v==='Baja'?'selected':''}>Baja</option>
  </select>`;
}

function statusSelect(id) {
  const s = taskStatus[id] || 'pending';
  return `<select class="mini-select" onchange="updateStatus('${id}',this.value)">
    <option value="pending" ${s==='pending'?'selected':''}>Pendiente</option>
    <option value="progress" ${s==='progress'?'selected':''}>En curso</option>
    <option value="done" ${s==='done'?'selected':''}>Listo</option>
  </select>`;
}

function etaCell(id) {
  const v = taskEta[id] || '';
  const isQ = v && v.startsWith('Q');
  const dateVal = isQ ? '' : (v || '');
  return `<div class="eta-wrap">
    <span class="eta-label">${isoToDisplay(v)}</span>
    <input type="date" class="mini-date" value="${dateVal}" onchange="updateEta('${id}',this.value)" style="width:22px;border:none;padding:0;opacity:0.35;cursor:pointer;background:transparent;" title="Cambiar fecha">
  </div>`;
}

function showSync(state, msg) {
  const bar = document.getElementById('sync-bar');
  bar.className = 'sync-bar visible ' + state;
  document.getElementById('sync-msg').textContent = msg;
  if (state === 'saved' || state === 'error') setTimeout(() => { bar.className = 'sync-bar'; }, 3000);
}

function scheduleSync() {
  if (saveTimer) clearTimeout(saveTimer);
  showSync('saving', 'Guardando...');
  saveTimer = setTimeout(syncToGitHub, 1500);
}

async function syncToGitHub() {
  const updated = JSON.parse(JSON.stringify(data));
  Object.values(updated.areas).forEach(area => {
    [...(area.people||[]), ...(area.kams||[])].forEach(p => {
      p.tasks.forEach(t => {
        t.status = taskStatus[t.id] ?? t.status;
        t.priority = taskPriority[t.id] ?? t.priority;
        t.eta = taskEta[t.id] ?? t.eta;
        t.updates = taskUpdates[t.id] ?? t.updates ?? [];
        t.kr = taskKr[t.id] ?? t.kr ?? null;
      });
    });
  });
  try {
    const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
    if (res.ok) { data = updated; document.getElementById('last-updated').textContent = 'Actualizado: ' + new Date().toISOString().split('T')[0]; showSync('saved', '✓ Guardado en GitHub'); }
    else showSync('error', 'Error al guardar');
  } catch(e) { showSync('error', 'Error de conexión'); }
}

function updatePriority(id, val) { taskPriority[id] = val || null; scheduleSync(); renderAll(); }
function updateStatus(id, val) { taskStatus[id] = val; scheduleSync(); renderAll(); }
function updateEta(id, val) { taskEta[id] = val || null; scheduleSync(); renderAll(); }

function toggleUpdates(id, btn) {
  const row = document.getElementById('upanel-row-' + id);
  if (!row) return;
  const isOpen = row.classList.contains('open');
  row.classList.toggle('open', !isOpen);
  const count = (taskUpdates[id]||[]).length;
  btn.textContent = !isOpen ? ('▲' + (count?' '+count:'')) : ('▼' + (count?' '+count:''));
}

function addUpdate(id) {
  const input = document.getElementById('uinput-' + id);
  const text = input?.value.trim();
  if (!text) return;
  const today = new Date();
  const label = String(today.getDate()).padStart(2,'0') + '.' + String(today.getMonth()+1).padStart(2,'0');
  if (!taskUpdates[id]) taskUpdates[id] = [];
  taskUpdates[id].unshift({ date: label, text });
  input.value = '';
  scheduleSync(); renderAll();
}

function deleteTask(personId, taskId) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  let found = false;
  Object.values(data.areas).forEach(a => {
    [...(a.people||[]), ...(a.kams||[])].forEach(p => {
      if (p.id === personId) {
        const idx = p.tasks.findIndex(t => t.id === taskId);
        if (idx !== -1) { p.tasks.splice(idx, 1); found = true; }
      }
    });
  });
  if (found) { delete taskStatus[taskId]; delete taskPriority[taskId]; delete taskEta[taskId]; delete taskUpdates[taskId]; delete taskKr[taskId]; scheduleSync(); renderAll(); }
}

function toggleMovePanel(id) {
  const row = document.getElementById('move-row-' + id);
  if (!row) return;
  row.classList.toggle('open');
}

function applyMove(taskId, personId) {
  const sel = document.getElementById('move-kr-' + taskId);
  if (!sel) return;
  taskKr[taskId] = sel.value;
  toggleMovePanel(taskId);
  scheduleSync(); renderAll();
}

function showAddRow(personId, krCat, tableId) {
  const existing = document.getElementById('add-row-' + tableId);
  if (existing) { existing.remove(); return; }
  const tbody = document.getElementById('tbody-' + tableId);
  if (!tbody) return;
  const tr = document.createElement('tr');
  tr.id = 'add-row-' + tableId;
  tr.className = 'add-task-row';
  tr.innerHTML = `
    <td><input id="new-cat-${tableId}" placeholder="Categoría" /></td>
    <td><input id="new-desc-${tableId}" placeholder="Descripción..." /></td>
    <td><select class="mini-select" id="new-prio-${tableId}">
      <option value="">—</option><option value="Alta">Alta</option><option value="Media">Media</option><option value="Baja">Baja</option>
    </select></td>
    <td><select class="mini-select" id="new-status-${tableId}">
      <option value="pending">Pendiente</option><option value="progress">En curso</option><option value="done">Listo</option>
    </select></td>
    <td><input type="date" class="mini-date" id="new-eta-${tableId}" style="width:100%" /></td>
    <td><button class="add-task-btn" onclick="saveNewTask('${personId}','${krCat}','${tableId}')">✓</button></td>
  `;
  tbody.appendChild(tr);
  document.getElementById('new-desc-' + tableId).focus();
}

function saveNewTask(personId, krCat, tableId) {
  const cat = (document.getElementById('new-cat-' + tableId)?.value || '').trim();
  const desc = (document.getElementById('new-desc-' + tableId)?.value || '').trim();
  const prio = document.getElementById('new-prio-' + tableId)?.value || null;
  const status = document.getElementById('new-status-' + tableId)?.value || 'pending';
  const eta = document.getElementById('new-eta-' + tableId)?.value || null;
  if (!desc) { alert('Ingresa una descripción'); return; }

  const id = 't' + Date.now();
  const newTask = { id, type: 'little', cat: cat || 'General', desc, priority: prio||null, eta: eta||null, status, link: '', updates: [], kr: krCat||null };

  let found = false;
  Object.values(data.areas).forEach(a => {
    [...(a.people||[]), ...(a.kams||[])].forEach(p => {
      if (p.id === personId) { p.tasks.push(newTask); found = true; }
    });
  });
  if (found) { taskStatus[id]=status; taskPriority[id]=prio; taskEta[id]=eta; taskUpdates[id]=[]; taskKr[id]=krCat||null; scheduleSync(); renderAll(); }
}

function renderTaskRow(t, personId, krs) {
  const hi = taskPriority[t.id] === 'Alta';
  const updates = taskUpdates[t.id] || [];
  const uCount = updates.length;
  const krOptions = krs.map(kr => `<option value="${kr.cat}" ${taskKr[t.id]===kr.cat?'selected':''}>${kr.cat}</option>`).join('');
  return `
    <tr class="${hi?'high-prio':''}">
      <td><span class="task-cat">${t.cat}</span></td>
      <td><div class="task-desc">${t.desc}</div>${t.link?`<a class="task-link" href="${t.link}" target="_blank">↗ StarTrek</a>`:''}</td>
      <td>${prioSelect(t.id)}</td>
      <td>${statusSelect(t.id)}</td>
      <td>${etaCell(t.id)}</td>
      <td>
        <div class="action-btns">
          <button class="update-toggle" onclick="toggleUpdates('${t.id}',this)" title="Historial">▼${uCount?' '+uCount:''}</button>
          ${krs.length>1?`<button class="move-btn" onclick="toggleMovePanel('${t.id}')" title="Mover a otro KR">⇄</button>`:''}
          <button class="delete-btn" onclick="deleteTask('${personId}','${t.id}')" title="Eliminar">✕</button>
        </div>
      </td>
    </tr>
    <tr class="move-modal-row" id="move-row-${t.id}">
      <td colspan="6" style="padding:0">
        <div class="move-modal-inner">
          <label>Mover a KR:</label>
          <select id="move-kr-${t.id}">${krOptions}</select>
          <button onclick="applyMove('${t.id}','${personId}')">Mover</button>
          <button class="cancel-btn" onclick="toggleMovePanel('${t.id}')">Cancelar</button>
        </div>
      </td>
    </tr>
    <tr class="update-panel-row" id="upanel-row-${t.id}">
      <td colspan="6" style="padding:0;border-bottom:1px solid #f0f0f0;">
        <div class="update-panel-inner">
          ${uCount ? updates.map(u=>`<div class="update-entry"><span class="update-date">${u.date}:</span>${u.text}</div>`).join('') : '<div class="update-entry" style="color:#bbb;font-style:italic">Sin actualizaciones aún</div>'}
          <div class="update-add">
            <input id="uinput-${t.id}" placeholder="Agregar update..." onkeydown="if(event.key==='Enter')addUpdate('${t.id}')" />
            <button onclick="addUpdate('${t.id}')">+ Agregar</button>
          </div>
        </div>
      </td>
    </tr>`;
}

function renderTaskBlock(p) {
  const krs = p.krs || [];
  const total = p.tasks.filter(t => taskStatus[t.id] !== 'done').length;

  let allTasks = onlyPrio ? p.tasks.filter(t => taskPriority[t.id]==='Alta') : p.tasks;

  let html = `<div class="person-block">
    <div class="person-header">
      <div class="avatar" style="background:${p.bg};color:${p.tc}">${p.initials}</div>
      <div><div class="person-name">${p.name}</div><div class="task-count">${total} pendiente${total!==1?'s':''}</div></div>
    </div>`;

  const tableHeader = `<thead><tr>
    <th style="width:100px">Categoría</th>
    <th>Descripción</th>
    <th style="width:80px">Prioridad</th>
    <th style="width:88px">Estado</th>
    <th style="width:110px">ETA</th>
    <th style="width:70px"></th>
  </tr></thead>`;

  if (!krs.length) {
    // No KRs: show as "KR Pendiente" section
    const tableId = p.id + '-nokr';
    html += `<div class="kr-subsection">
      <div class="kr-subsection-header"><span class="kr-subsection-title">KR Pendiente</span></div>
      <table class="task-table">${tableHeader}<tbody id="tbody-${tableId}">`;
    allTasks.forEach(t => { html += renderTaskRow(t, p.id, krs); });
    html += `</tbody></table>
      <span class="add-row-trigger" onclick="showAddRow('${p.id}',null,'${tableId}')">＋ Agregar tarea</span>
    </div>`;
  } else {
    krs.forEach((kr, i) => {
      const tableId = p.id + '-kr' + i;
      const krTasks = allTasks.filter(t => taskKr[t.id] === kr.cat);
      html += `<div class="kr-subsection">
        <div class="kr-subsection-header">
          <span class="kr-subsection-title">${kr.cat}</span>
          <span class="kr-subsection-desc">${kr.desc}</span>
          <span class="kr-subsection-eta">${kr.eta}</span>
        </div>
        <table class="task-table">${tableHeader}<tbody id="tbody-${tableId}">`;
      if (krTasks.length) {
        krTasks.forEach(t => { html += renderTaskRow(t, p.id, krs); });
      } else {
        html += `<tr><td colspan="6" style="padding:6px 8px;font-size:11px;color:#ccc;font-style:italic">Sin tareas en este KR</td></tr>`;
      }
      html += `</tbody></table>
        <span class="add-row-trigger" onclick="showAddRow('${p.id}','${kr.cat}','${tableId}')">＋ Agregar tarea</span>
      </div>`;
    });

    // Tasks not assigned to any KR
    const unassigned = allTasks.filter(t => !taskKr[t.id] || !krs.find(kr => kr.cat === taskKr[t.id]));
    if (unassigned.length) {
      const tableId = p.id + '-unassigned';
      html += `<div class="kr-subsection">
        <div class="kr-subsection-header"><span class="kr-subsection-title" style="color:#aaa">Sin KR</span></div>
        <table class="task-table">${tableHeader}<tbody id="tbody-${tableId}">`;
      unassigned.forEach(t => { html += renderTaskRow(t, p.id, krs); });
      html += `</tbody></table></div>`;
    }
  }

  html += `</div>`;
  return html;
}

function renderBoard() {
  if (!data) return;
  const container = document.getElementById('view-board');
  let people, kams;
  if (currentArea === 'all') {
    people = []; kams = [];
    Object.values(data.areas).forEach(a => {
      people = people.concat(currentPerson==='all' ? (a.people||[]) : (a.people||[]).filter(x=>x.id===currentPerson));
      kams = kams.concat(currentPerson==='all' ? (a.kams||[]) : (a.kams||[]).filter(x=>x.id===currentPerson));
    });
  } else {
    people = filteredPeople(); kams = filteredKams();
  }
  if (!people.length && !kams.length) { container.innerHTML = '<div class="empty">Sin datos para esta área aún</div>'; return; }
  let html = people.map(p => renderTaskBlock(p)).join('');
  if (kams.length) { html += `<div class="kam-label">KAMs — Partner Ops</div>`; html += kams.map(p => renderTaskBlock(p)).join(''); }
  container.innerHTML = html;
}

function renderToday() {
  if (!data) return;
  const container = document.getElementById('view-today');
  const today = new Date().toISOString().split('T')[0];
  const people = [...filteredPeople(), ...filteredKams()];
  let html = '<div class="today-grid">'; let any = false;
  people.forEach(p => {
    let tasks = p.tasks.filter(t => taskStatus[t.id] !== 'done');
    const due = tasks.filter(t => taskEta[t.id] && !String(taskEta[t.id]).startsWith('Q') && taskEta[t.id] <= today);
    const hi = tasks.filter(t => taskPriority[t.id]==='Alta' && !due.find(d=>d.id===t.id));
    let all = [...due, ...hi];
    if (onlyPrio) all = all.filter(t => taskPriority[t.id]==='Alta');
    if (!all.length) return;
    any = true;
    html += `<div class="today-card"><div class="today-card-header">
      <div class="avatar" style="background:${p.bg};color:${p.tc};width:26px;height:26px;font-size:10px">${p.initials}</div>
      <span style="font-size:12px;font-weight:600;color:#1a1a1a">${p.name}</span>
      <span style="font-size:10px;color:#aaa;margin-left:auto">${all.length} tarea${all.length!==1?'s':''}</span>
    </div>`;
    all.forEach(t => {
      const checked = taskStatus[t.id]==='done';
      html += `<div class="today-task">
        <div class="check-box ${checked?'checked':''}" onclick="toggleDone('${t.id}')">${checked?'✓':''}</div>
        <div style="flex:1">
          <div style="font-size:11px;color:#1a1a1a;${checked?'text-decoration:line-through;color:#aaa':''}">${t.desc}</div>
          <div style="font-size:10px;color:#aaa;margin-top:1px">${t.cat}${taskEta[t.id]&&!String(taskEta[t.id]).startsWith('Q')?' · '+isoToDisplay(taskEta[t.id]):''}${taskPriority[t.id]==='Alta'?' · <span style="color:#c0392b">Alta</span>':''}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  if (!any) html = '<div class="empty">No hay tareas urgentes para hoy</div>';
  container.innerHTML = html;
}

function toggleDone(id) { taskStatus[id] = taskStatus[id]==='done' ? 'pending' : 'done'; scheduleSync(); renderAll(); }

function renderGantt() {
  if (!data) return;
  const container = document.getElementById('view-gantt');
  const people = [...filteredPeople(), ...filteredKams()];
  const START = new Date('2026-04-01'), END = new Date('2026-06-30');
  const TOTAL = (END - START) / 86400000;
  const months = ['Abr','May','Jun'];
  const startDates = { t1:'2026-04-10', t2:'2026-04-15', t13:'2026-04-14' };
  let rows = ''; let any = false;
  people.forEach(p => {
    let tasks = p.tasks.filter(t => taskEta[t.id] && !String(taskEta[t.id]).startsWith('Q'));
    if (onlyPrio) tasks = tasks.filter(t => taskPriority[t.id]==='Alta');
    if (!tasks.length) return;
    any = true;
    tasks.forEach(t => {
      const eta = new Date(taskEta[t.id]+'T12:00:00');
      const sd = new Date((startDates[t.id]||'2026-04-21')+'T12:00:00');
      const sp = Math.max(0,(sd-START)/86400000/TOTAL*100);
      const ep = Math.min(100,(eta-START)/86400000/TOTAL*100);
      const w = Math.max(2,ep-sp);
      const col = taskStatus[t.id]==='done'?'#639922':taskStatus[t.id]==='progress'?'#185FA5':'#aaa';
      rows += `<div class="gantt-row">
        <div class="gantt-label" title="${t.desc}">${t.cat}</div>
        <div class="gantt-av"><div class="avatar" style="background:${p.bg};color:${p.tc};width:22px;height:22px;font-size:9px;display:inline-flex">${p.initials}</div></div>
        <div class="gantt-track"><div class="gantt-bar" style="left:${sp}%;width:${w}%;background:${col}">${w>8?isoToDisplay(taskEta[t.id]):''}</div></div>
      </div>`;
    });
  });
  if (!any) { container.innerHTML = '<div class="empty">No hay tareas con fecha para mostrar en Gantt</div>'; return; }
  container.innerHTML = `<div class="gantt-wrap"><div class="gantt-months">${months.map(m=>`<div class="gantt-month">${m}</div>`).join('')}</div>${rows}</div>`;
}

function renderAll() { renderBoard(); renderToday(); renderGantt(); }
loadData();
</script>
</body>
</html>
